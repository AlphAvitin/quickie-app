<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Quickie sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
      body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; }
      main { max-width: 360px; }
      img { width: 112px; height: 112px; margin-bottom: 24px; }
      h1 { font-size: 24px; margin: 0 0 10px; }
      p { color: #aaa; line-height: 1.5; margin: 0 0 22px; }
      button { border: 0; border-radius: 14px; padding: 14px 20px; color: #fff; background: #ef1684; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet e tente novamente. Suas conversas e dados não são salvos para uso offline.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
